[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arctic-qa"
version = "0.1.0"
description = "Local source-supported scientific QA dataset construction pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arctic QA collaborators" }]
dependencies = []

[project.scripts]
arctic-qa = "arctic_qa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arctic_qa = ["data/*.json", "corpus_viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
